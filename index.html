<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>花浅葱 | みんなでメトロノーム</title>
<meta name="description" content="連弾で、同じテンポを感じながら弾きたい。離れた場所にいても、同じテンポで練習したい。そんな思いから『みんなでメトロノーム』を作りました。">
<meta name="theme-color" content="#FAF7EF">
<meta name="color-scheme" content="light">

<meta property="og:type" content="website">
<meta property="og:locale" content="ja_JP">
<meta property="og:url" content="https://hanaasa-dev.github.io/exhibition/">
<meta property="og:title" content="花浅葱 | みんなでメトロノーム">
<meta property="og:description" content="連弾で、同じテンポを感じながら弾きたい。そんな思いから『みんなでメトロノーム』を作りました。">
<meta property="og:image" content="https://hanaasa-dev.github.io/exhibition/assets/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="みんなでメトロノームのアイコンと、花浅葱の文字">
<meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@400;500&display=swap">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<style>
  :root {
    --bg: #FAF7EF;
    --line: #E2DACA;
    --ink: #2A1A45;
    --muted: #5C536B;
    --purple: #3B1F63;
    --green: #BBDA19;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Kiwi Maru", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif;
    line-height: 1.75;
  }
  .page {
    max-width: 440px;
    margin: 0 auto;
    padding: 28px 24px 40px;
    text-align: center;
  }
  p { margin: 0; }
  /* 日本語を文節の途中で折り返さない（<wbr> の位置でだけ折り返す） */
  .phrase { word-break: keep-all; overflow-wrap: anywhere; }

  /* 制作者 */
  .creator h1 {
    margin: 0;
    font-size: 32px;
    font-weight: 500;
    letter-spacing: 0.18em;
    line-height: 1.3;
    padding-left: 0.18em;
    color: var(--purple);
  }
  .creator .kana {
    margin-top: 2px;
    font-size: 13px;
    letter-spacing: 0.16em;
    color: var(--muted);
  }

  /* 黄緑のステッチ線 */
  .stitch {
    width: 72px;
    margin: 18px auto;
    border: 0;
    border-top: 3px dashed var(--green);
  }

  /* 動機 */
  .story p {
    font-size: 15px;
    line-height: 1.8;
  }
  .story p + p { margin-top: 6px; }

  /* アプリ */
  .app { margin-top: 24px; }
  .app-icon {
    display: block;
    width: 104px;
    height: 104px;
    margin: 0 auto;
    border-radius: 24px;
    box-shadow: 0 0 0 1px rgba(42, 26, 69, 0.08);
  }
  .app h2 {
    margin: 8px 0 0;
    font-size: 20px;
    font-weight: 500;
    line-height: 1.4;
    color: var(--purple);
  }
  /* ストアバッジ（Appleの公式素材をそのまま使う。間は高さの1/4以上あける）
     Apple：最小40px・ほかのストアと並べる時は黒を先に置く */
  .stores {
    --bh: clamp(40px, calc((100vw - 48px) / 6.6), 48px);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: calc(var(--bh) / 4 + 2px);
    margin-top: 16px;
  }
  .badge { display: block; line-height: 0; }
  .badge-apple img { height: var(--bh); width: auto; }
  /* Android版の準備中の枠：App Storeバッジと同じ幅・高さ・角の丸み */
  .badge-soon {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: calc(var(--bh) * 108.85 / 40);
    height: var(--bh);
    border: 1px solid #CFC6B4;
    border-radius: calc(var(--bh) * 0.16);
    color: var(--muted);
    font-size: 12px;
    line-height: 1.3;
  }
  .badge-apple:focus-visible,
  .more:focus-visible {
    outline: 3px solid var(--green);
    outline-offset: 3px;
  }

  /* ほかの作品 */
  .more {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-height: 48px;
    margin-top: 32px;
    padding: 0 8px;
    color: var(--purple);
    font-size: 15px;
    font-weight: 500;
    text-decoration: underline;
    text-decoration-color: var(--green);
    text-decoration-thickness: 2px;
    text-underline-offset: 6px;
  }
  footer {
    margin-top: 28px;
    font-size: 12px;
    letter-spacing: 0.08em;
    color: var(--muted);
  }
</style>
</head>
<body>
<div class="page">

  <header class="creator">
    <h1>花浅葱</h1>
    <p class="kana">はなあさぎ</p>
  </header>

  <hr class="stitch">

  <main>
    <section class="story phrase">
      <p>連弾で、<wbr>同じテンポを<wbr>感じながら<wbr>弾きたい。</p>
      <p>離れた場所にいても、<wbr>同じテンポで<wbr>練習したい。</p>
      <p>そんな思いから<wbr>『みんなでメトロノーム』を<wbr>作りました。</p>
    </section>

    <section class="app" aria-labelledby="app-name">
      <img class="app-icon" src="assets/app-icon.jpg" width="104" height="104" alt="">
      <h2 id="app-name">みんなでメトロノーム</h2>
      <div class="stores">
        <a class="badge badge-apple" href="https://apps.apple.com/jp/app/id6801993680">
          <img src="assets/badge-app-store-ja.svg" width="131" height="48" alt="App Storeからダウンロード">
        </a>
        <!-- Android版を公開したら、下の div を Google Play の公式バッジに差し替える。
             バッジは Google の Partner Marketing Hub から最新の日本語版を取り、assets/ に置く。
             Google の決まり：高さ28px以上・ほかのバッジと同じ大きさ以上・色や形を変えない。
          <a class="badge badge-play" href="https://play.google.com/store/apps/details?id=com.hanaasa.minnademetronome">
            <img src="assets/badge-google-play-ja.png" alt="Google Play で手に入れよう">
          </a>
        -->
        <div class="badge-soon" role="img" aria-label="Android版は準備中です">
          <span>Android版</span><span>準備中</span>
        </div>
      </div>
    </section>

    <a class="more" href="https://hanaasa-dev.github.io/portfolio/">ほかの作品を見る<span aria-hidden="true">›</span></a>
  </main>

  <footer>© HANAASA</footer>

</div>
</body>
</html>
